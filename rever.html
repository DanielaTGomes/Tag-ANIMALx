

<script>
(function () {
    const wrapper = document.getElementById('animalx-gamification-wrapper');

function toggleFullscreen() {
        // Aponta especificamente para a caixa do jogo, em vez da página toda
        let gameContainer = document.getElementById('animalx-gamification-wrapper');

        if (!document.fullscreenElement) {
            // Entra em ecrã inteiro APENAS no contentor do jogo
            if (gameContainer.requestFullscreen) {
                gameContainer.requestFullscreen().catch(err => {
                    console.log(`Erro ao entrar em ecrã inteiro: ${err.message}`);
                });
            } else if (gameContainer.webkitRequestFullscreen) { /* Safari antigo */
                gameContainer.webkitRequestFullscreen();
            }
        } else {
            // Sai de ecrã inteiro
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    // Mantém o detetor para ajudar o CSS
    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            document.body.classList.add('em-tela-cheia');
        } else {
            document.body.classList.remove('em-tela-cheia');
        }
    });

    window.toggleFullscreen = toggleFullscreen;
})();
</script>

<script>
// =========================================
// LÓGICA DE NAVEGAÇÃO DAS TELAS PRINCIPAIS
// =========================================

function irParaTela(idTelaDestino) {
    // 1. Encontra todas as telas com a classe 'animalx-screen'
    let telas = document.getElementsByClassName('animalx-screen');
    
    // 2. Remove a classe 'active' de todas elas (esconde tudo)
    for (let i = 0; i < telas.length; i++) {
        telas[i].classList.remove('active');
    }
    
    // 3. Adiciona a classe 'active' APENAS à tela de destino (mostra a tela certa)
    let telaDestino = document.getElementById(idTelaDestino);
    if (telaDestino) {
        // Se a tela de destino for o formulário, dizemos à API para ir buscar os dados
        telaDestino.classList.add('active');
        if (idTelaDestino === 'screen-formulario') {
            if (typeof window.carregarItemANIMALx === 'function') {
                window.carregarItemANIMALx();
            }
        }
    }
}

</script>

<script>


// Abrir o Modal do Caderno
function abrirCaderno() {
    // Atualiza os pontos e a interface antes de mostrar o caderno!
    if (typeof window.atualizarCadernoDeCampo === 'function') {
        window.atualizarCadernoDeCampo();
    }
    
    // Muda o display para revelar o modal
    document.getElementById('modal-caderno-campo').style.setProperty('display', 'flex', 'important');
}
let folhaAtual = 1;
const totalFolhas = 2;

function mudarFolhaCaderno(direcao) {
    let novaFolha = folhaAtual + direcao;

    if (novaFolha >= 1 && novaFolha <= totalFolhas) {
        document.getElementById(`caderno-folha-${folhaAtual}`).classList.remove('active');
        document.getElementById(`caderno-folha-${novaFolha}`).classList.add('active');
        
        folhaAtual = novaFolha;
        atualizarBotoesNavegacao();
    }
}

function atualizarBotoesNavegacao() {
    const btnPrev = document.getElementById('btn-caderno-prev');
    const btnNext = document.getElementById('btn-caderno-next');

    if (folhaAtual === 1) {
        btnPrev.style.opacity = "0.4";
        btnPrev.style.pointerEvents = "none";
    } else {
        btnPrev.style.opacity = "1";
        btnPrev.style.pointerEvents = "auto";
    }

    if (folhaAtual === totalFolhas) {
        btnNext.style.opacity = "0.4";
        btnNext.style.pointerEvents = "none";
    } else {
        btnNext.style.opacity = "1";
        btnNext.style.pointerEvents = "auto";
    }
}

document.addEventListener("DOMContentLoaded", function() {
    atualizarBotoesNavegacao();
});

function fecharCaderno() {
    let modal = document.getElementById('modal-caderno-campo');
    if (modal) {
        modal.style.setProperty('display', 'none', 'important');
    }
}

// Tornar a função global para que o botão HTML a consiga encontrar
window.fecharCaderno = fecharCaderno;
</script>

<script>
function irParaPasso(destino) {
    let totalPassos = 6; // O número total de perguntas do teu formulário

    // 1. Esconde todos os passos com um ciclo automático (do 1 ao 6)
    for (let i = 1; i <= totalPassos; i++) {
        let passo = document.getElementById('passo-' + i);
        if (passo) {
            passo.style.setProperty('display', 'none', 'important');
        }
    }

    // 2. Mostra apenas o passo de destino
    let destinoEl = document.getElementById('passo-' + destino);
    if (destinoEl) {
        destinoEl.style.setProperty('display', 'flex', 'important');
    }

// 3. Captura os elementos específicos do rodapé deste formulário
    let barra = document.getElementById('barra-progresso-form');
    let btnAnterior = document.getElementById('btn-anterior-form');
    let btnSeguinte = document.getElementById('btn-seguinte-form');
    let btnSubmeter = document.getElementById('btn-submeter-form');

    // 4. A MAGIA: Calcula a percentagem da barra automaticamente!
    // (Ex: 1/6 = 16.6%, 2/6 = 33.3%, etc.)
    let percentagem = (destino / totalPassos) * 100;
    barra.style.width = percentagem + '%';

    if (destino === totalPassos) {
        barra.style.borderRadius = '15px'; // Arredonda a ponta direita na última pergunta
    } else {
        barra.style.borderRadius = '15px 0 0 15px'; // Mantém reta nas outras
    }

    // 5. Lógica Inteligente de Visibilidade dos Botões
    if (destino === 1) {
        // Na P1: Esconde o Anterior e o Submeter
        btnAnterior.style.setProperty('display', 'none', 'important');
        btnSubmeter.style.setProperty('display', 'none', 'important');
        btnSeguinte.style.setProperty('display', 'flex', 'important');
    } else if (destino === totalPassos) {
        // Na P6: Esconde o Seguinte, mostra o Anterior e o Submeter
        btnAnterior.style.setProperty('display', 'flex', 'important');
        btnSeguinte.style.setProperty('display', 'none', 'important');
        btnSubmeter.style.setProperty('display', 'block', 'important');
    } else {
        // Nas P2, P3, P4 e P5: Mostra o Anterior e o Seguinte
        btnAnterior.style.setProperty('display', 'flex', 'important');
        btnSeguinte.style.setProperty('display', 'flex', 'important');
        btnSubmeter.style.setProperty('display', 'none', 'important');
    }

    // 6. Atualiza os destinos dos cliques automaticamente (A matemática faz o trabalho!)
    btnAnterior.setAttribute('onclick', 'irParaPasso(' + (destino - 1) + ')');
    btnSeguinte.setAttribute('onclick', 'avancarSeValido(' + destino + ')');
}

irParaPasso(1);

    // Função para garantir que apenas um botão é selecionado de cada vez
function selecionarOpcao(botaoClicado, idGrupo) {
    // 1. Encontra a "caixa" (grupo) onde estão os botões desta pergunta
    let grupo = document.getElementById(idGrupo);
    
    // 2. Encontra todos os botões dentro desse grupo
    let botoes = grupo.getElementsByClassName('animalx-btn-opcao');
    
    // 3. Remove a classe 'selecionado' de todos eles (limpa as seleções anteriores)
    for (let i = 0; i < botoes.length; i++) {
        botoes[i].classList.remove('selecionado');
    }
    
    // 4. Adiciona a classe 'selecionado' APENAS ao botão que o utilizador clicou agora
    botaoClicado.classList.add('selecionado');
}

function acaoBotaoSim(botao, idGrupo) {

    selecionarOpcao(botao, idGrupo);
    
    // 2. Recolhe os dados para a futura base de dados
    // recolherDadosDaPergunta(1, 'SIM');
    
}

function acaoBotaoNao(botao, idGrupo) {

    selecionarOpcao(botao, idGrupo);
    
    // 2. Recolhe os dados para a futura base de dados
    // recolherDadosDaPergunta(1, 'NAO');
    
}

        if (modal) {

        }
    }

    let passoAtualGuia = 1;
    const totalPassosGuia = 6;

    function mudarPassoGuia(direcao) {
        let novaPasso = passoAtualGuia + direcao;

        if (novaPasso >= 1 && novaPasso <= totalPassosGuia) {

            document.getElementById(`guia-passo-${novaPasso}`).style.display = "flex";

<script>

    function abrirModalValidacao() {
        let modal = document.getElementById("modal-validacao");
        if (modal) modal.style.setProperty('display', 'flex', 'important');
    }

    function fecharModalValidacao() {
        let modal = document.getElementById("modal-validacao");
        if (modal) modal.style.setProperty('display', 'none', 'important');
    }

    // Verifica se o passo atual tem uma resposta válida
    function passoValido(passo) {
        if (passo === 1) {
            let botoes = document.getElementById('opcoes-p1').getElementsByClassName('selecionado');
            return botoes.length > 0;
        } else if (passo === 2) {
            let input = document.getElementById('input-animal').value;
            let naoSei = document.getElementById('check-nao-sei').checked;
            return (input.trim() !== "" || naoSei);
        } else if (passo === 3) {
            let input = document.getElementById('input-quantidade').value;
            let naoSei = document.getElementById('check-nao-sei-p3').checked;
            return (input.trim() !== "" || naoSei);
        } else if (passo === 4) {
            let input = document.getElementById('input-funcao').value;
            let naoSei = document.getElementById('check-nao-sei-p4').checked;
            return (input.trim() !== "" || naoSei);
        } else if (passo === 5) {
            // Passo 5 livre de validação, avança sempre
            return true; 
        } else if (passo === 6) {
            let botoes = document.getElementById('opcoes-p6').getElementsByClassName('selecionado');
            return botoes.length > 0;
        }
        return true;
    }


    // Função auxiliar para verificar se a opção selecionada na P1 foi "NÃO"
    function verificarRespostaNaoP1() {
        const containerP1 = document.getElementById('opcoes-p1');
        if (!containerP1) return false;

        const btnSelecionado = containerP1.querySelector('.animalx-btn-opcao.selecionado');
        if (!btnSelecionado) return false;

        return btnSelecionado.innerText.trim().toUpperCase() === 'NÃO';
    }

    // Interceta o botão Seguinte
    function avancarSeValido(passoAtual) {
        if (passoValido(passoAtual)) {
            
            // --- REGRA ESPECIAL DA PERGUNTA 1 ---
            if (passoAtual === 1) {
                // Se o utilizador respondeu NÃO na P1, salta diretamente para o Modal de Submissão!
                if (verificarRespostaNaoP1()) {
                    abrirModalSubmissao(); // Mostra logo o aviso de submissão
                    return; // Interrompe a função, não o deixando ir para a P2!
                }
            }

            // Se respondeu SIM na P1 (ou se estiver a avançar noutros passos), vai para a seguinte
            irParaPasso(passoAtual + 1);

        } else {
            abrirModalValidacao();
        }
    }

    // Interceta o botão Submeter
    function submeterSeValido(passoAtual) {
        if (passoValido(passoAtual)) {
            abrirModalSubmissao();
        } else {
            abrirModalValidacao();
        }
    }

</script>

<script type="module">

// ===================================================
// FERRAMENTAS DE LIMPEZA E VERIFICAÇÃO DO FORMULÁRIO
// ===================================================

// Função auxiliar para verificar a seleção do botão SIM na Pergunta 6
function verificarRespostaSimP6() {
    const containerP6 = document.getElementById('opcoes-p6');
    if (!containerP6) return false;

    const btnSim = Array.from(containerP6.querySelectorAll('.animalx-btn-opcao'))
                        .find(btn => btn.innerText.trim().toUpperCase() === 'SIM');

    return btnSim ? btnSim.classList.contains('selecionado') : false;
}

// Limpa apenas os campos do animal individual (P2 a P6), mantendo a P1 intacta ("SIM")
function limparCamposP2aP6() {
    // 1. Limpar Inputs de texto
    const idInputs = ['input-animal', 'input-quantidade', 'input-funcao', 'input-descricao'];
    idInputs.forEach(id => {
        let el = document.getElementById(id);
        if (el) el.value = '';
    });

    // 2. Desmarcar botões "Não Sei"
    const idRadios = ['check-nao-sei', 'check-nao-sei-p3', 'check-nao-sei-p4', 'check-nao-sei-p5'];
    idRadios.forEach(id => {
        let radio = document.getElementById(id);
        if (radio) radio.checked = false;
    });

    // 3. Desmarcar botões SIM/NÃO apenas da Pergunta 6
    const containerP6 = document.getElementById('opcoes-p6');
    if (containerP6) {
        let btns = containerP6.querySelectorAll('.animalx-btn-opcao');
        btns.forEach(btn => btn.classList.remove('selecionado'));
    }

    // 4. Esconder listas de dropdown que possam ter ficado abertas
    let listas = document.querySelectorAll('.animalx-lista-opcoes');
    listas.forEach(lista => lista.style.display = 'none');
}

// Limpa todo o formulário (P1 a P6) para carregar um novo registo limpo
function limparFormulario() {
    // Aproveita a limpeza que já fizemos da P2 à P6...
    limparCamposP2aP6();
    
    // ... e limpa também os botões SIM/NÃO da P1
    const containerP1 = document.getElementById('opcoes-p1');
    if (containerP1) {
        let btns = containerP1.querySelectorAll('.animalx-btn-opcao');
        btns.forEach(btn => btn.classList.remove('selecionado'));
    }
}

async function confirmarSubmissao() {
    // 1. Esconde o modal de confirmação
    fecharModal();

    // 2. SUBMISSÃO REAL PARA O OMEKA S
    console.log("⏳ A enviar dados para o Omeka S...");
    
    // Chama a função central do app.js que lê a interface e envia para a API
    const resultado = await window.submeterFormularioReal();

    // 3. Só avança na interface se a submissão tiver sucesso garantido!
    if (resultado && resultado.sucesso) {
        
        // Verifica se o utilizador respondeu "SIM" na Pergunta 6 ("Existe outro animal?")
        const temOutroAnimal = verificarRespostaSimP6();

        if (temOutroAnimal) {
            // --- CASO 1: HÁ MAIS ANIMAIS NA MESMA IMAGEM ---
            console.log("-> [DUPLICAÇÃO]: A manter a imagem base e a regressar à Pergunta 2 para novo animal.");

            // A. Limpa apenas as respostas do formulário (P2 a P6)
            limparCamposP2aP6();

            // B. Regressa diretamente à Pergunta 2 (Identificação)
            irParaPasso(2);
            
        } else {
            // --- CASO 2: NÃO HÁ MAIS ANIMAIS (OU É O ÚLTIMO) ---
            console.log("-> [FINALIZADO]: A limpar formulário e a carregar novo registo do Omeka S.");
            
            // A. Limpa todos os campos do formulário (P1 a P6)
            limparFormulario();

            // B. Regressa à Pergunta 1
            irParaPasso(1);

            // C. Carrega um novo registo aleatório do Omeka S
            if (typeof window.carregarItemANIMALx === 'function') {
                await window.carregarItemANIMALx();
            }
        }
    } else {
        // Se houver erro de rede ou do Omeka, mostra um alerta e NÃO limpa o ecrã
        // Assim o utilizador não perde os dados preenchidos e pode tentar novamente
        alert("Atenção: Houve uma falha ao enviar o registo. Verifica a tua ligação e tenta novamente.");
    }
}
window.confirmarSubmissao = confirmarSubmissao;
</script>

<script>
    // =========================================
// VALIDAÇÃO DO ECRÃ DE REGISTO (CONSENTIMENTO)
// =========================================

function abrirModalConsentimento() {
    let modal = document.getElementById("modal-consentimento");
    if (modal) {
        modal.style.setProperty('display', 'flex', 'important');
    }
}

function fecharModalConsentimento() {
    let modal = document.getElementById("modal-consentimento");
    if (modal) {
        modal.style.setProperty('display', 'none', 'important');
    }
}

// Interceta o avanço do ecrã de registo para o formulário
function verificarConsentimentoEAvancar() {
    const modoParticipacao = document.querySelector('input[name="modo_participacao"]:checked')?.value;
    const consentimentoMarcado = document.getElementById('consentimento-dados')?.checked;

    // Se o utilizador escolheu "Registar" MAS NÃO marcou a caixa de consentimento
    if (modoParticipacao === 'registar' && !consentimentoMarcado) {
        // Abre o modal de aviso de consentimento que criaste
        abrirModalConsentimento();
        return; // Bloqueia o avanço
    }

    // Se estiver tudo em ordem (ou se for anónimo), avança para a tela do formulário
    irParaTela('screen-formulario');
}
</script>
