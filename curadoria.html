<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel de Curadoria - Tag ANIMALx</title>
    
    <!-- Widget da Netlify Identity -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    
    <!-- Conectar ao CSS da curadoria (e ao principal, se as fontes/variáveis estiverem lá) -->
    <link rel="stylesheet" href="css/animalx.css">
    <link rel="stylesheet" href="css/curadoria.css">
</head>
<body class="curadoria-body">
    
    <!-- ECRÃ DE LOGIN -->
    <div id="area-login" class="area-login">
        <h2 class="curadoria-titulo">Acesso Reservado à Equipa de Curadoria</h2>
        <button onclick="netlifyIdentity.open()" class="btn-curadoria btn-login">
            Entrar no Painel
        </button>
    </div>

    <!-- PAINEL DE CURADORIA -->
    <div id="area-curadoria" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="curadoria-titulo"> Tag ANIMALx: Painel de Curadoria </h1>
            <button onclick="netlifyIdentity.logout()" class="btn-curadoria btn-logout">
                Sair
            </button>
        </div>
        <p>A carregar os registos analisados pela comunidade...</p>
        
        <div id="painel-resultados"></div>
    </div>

    <script type="module" src="js/curadoria.js"></script>

    <script>
        netlifyIdentity.on('init', user => {
            if (!user) {
                netlifyIdentity.on('login', () => document.location.reload());
            } else {
                document.getElementById('area-login').style.display = 'none';
                document.getElementById('area-curadoria').style.display = 'block';
            }
        });
        netlifyIdentity.on('logout', () => document.location.reload());
    </script>
</body>
</html>
